<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meme Soundboard</title>
<style>
  :root {
    --bg1: #07111d;
    --bg2: #0d2033;
    --panel: rgba(11, 18, 31, 0.72);
    --border: rgba(255,255,255,0.10);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.70);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 20% 0%, rgba(95, 128, 255, 0.20), transparent 28%),
      radial-gradient(circle at 80% 100%, rgba(255, 79, 155, 0.14), transparent 24%),
      linear-gradient(180deg, var(--bg2), var(--bg1));
    color: var(--text);
    font-family: Inter, Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }
  .shell {
    width: min(1240px, calc(100vw - 24px));
    padding: 24px;
    border: 1px solid var(--border);
    border-radius: 30px;
    background: var(--panel);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
  }
  .header {
    text-align: center;
    margin-bottom: 18px;
  }
  .title {
    margin: 0;
    font-size: clamp(28px, 3vw, 48px);
    font-weight: 900;
    letter-spacing: 0.4px;
  }
  .subtitle {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 14px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
    margin: 18px auto 24px;
  }
  .ctl {
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: white;
    padding: 12px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 700;
    letter-spacing: 0.2px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform .14s ease, filter .14s ease, background .14s ease;
  }
  .ctl:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .ctl:active { transform: translateY(1px); }
  .rangeWrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
  }
  input[type="range"] {
    width: 180px;
    accent-color: white;
  }
  .status {
    min-width: 220px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 20px;
    justify-items: center;
    align-items: start;
    max-width: 1180px;
    margin: 0 auto;
  }
  .card {
    width: 170px;
    display: grid;
    justify-items: center;
    gap: 10px;
  }
  .orb {
    width: 118px;
    height: 118px;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(255,255,255,0.18) 11%, transparent 13%),
      radial-gradient(circle at 35% 34%, rgba(255,255,255,0.22), transparent 40%),
      linear-gradient(180deg, color-mix(in srgb, var(--c1) 90%, white 10%), var(--c2));
    box-shadow:
      inset 0 12px 20px rgba(255,255,255,0.18),
      inset 0 -16px 24px rgba(0,0,0,0.38),
      0 14px 32px rgba(0,0,0,0.38);
    transition: transform .14s ease, filter .14s ease, box-shadow .14s ease;
  }
  .orb::after {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.22);
  }
  .orb:hover {
    transform: translateY(-3px) scale(1.03);
    filter: brightness(1.06);
  }
  .orb:active {
    transform: translateY(1px) scale(0.985);
  }
  .active .orb {
    box-shadow:
      0 0 0 4px rgba(255,255,255,0.08),
      inset 0 12px 20px rgba(255,255,255,0.18),
      inset 0 -16px 24px rgba(0,0,0,0.38),
      0 0 36px rgba(255,255,255,0.18),
      0 14px 32px rgba(0,0,0,0.42);
  }
  .trackname {
    font-size: 14px;
    line-height: 1.25;
    text-align: center;
    text-decoration: underline;
    text-underline-offset: 2px;
    word-break: break-word;
    max-width: 170px;
    color: rgba(255,255,255,0.95);
  }
  .minirow {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mini {
    border: 0;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    color: white;
    font-weight: 700;
    font-size: 12px;
    min-width: 66px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.10);
  }
  .mini:hover { filter: brightness(1.08); }
  .play { background: rgba(63, 122, 255, 0.28); }
  .pause { background: rgba(255, 169, 63, 0.25); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 48px 0;
  }
  @media (max-width: 640px) {
    .shell { padding: 16px; border-radius: 22px; }
    .controls { gap: 10px; }
    .ctl, .rangeWrap { width: 100%; justify-content: center; }
    input[type="range"] { width: min(100%, 220px); }
    .card { width: 150px; }
    .orb { width: 102px; height: 102px; }
  }
</style>
</head>
<body>
  <main class="shell">
    <div class="header">
      <h1 class="title">Meme Soundboard</h1>
      <p class="subtitle">Centered layout with play, pause, stop, and volume controls</p>
    </div>

    <div class="controls">
      <button class="ctl" onclick="playSelected(currentFile)">Play</button>
      <button class="ctl" onclick="pauseToggle()">Pause / Resume</button>
      <button class="ctl" onclick="stopAll()">Stop</button>
      <div class="rangeWrap">
        <span style="font-weight:700;">Vol</span>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.85" oninput="setVolume(this.value)">
      </div>
      <div class="status" id="status">Choose a sound to start</div>
    </div>

    <section class="grid" id="grid">
      
      <div class="card" style="--c1:#ff5b5b; --c2:#b31212">
        <button class="orb" onclick="selectSound('Yara Yara Ya Phonk (Slowed).mp3')" aria-label="Play Yara Yara Ya Phonk (Slowed)"></button>
        <div class="trackname">Yara Yara Ya Phonk (Slowed)</div>
        <div class="minirow">
          <button class="mini play" onclick="playSelected('Yara Yara Ya Phonk (Slowed).mp3')">Play</button>
          <button class="mini pause" onclick="pauseToggle()">Pause</button>
        </div>
      </div>
    

      <div class="card" style="--c1:#4c7dff; --c2:#1847cc">
        <button class="orb" onclick="selectSound('TIKI TIKI.mp3')" aria-label="Play TIKI TIKI"></button>
        <div class="trackname">TIKI TIKI</div>
        <div class="minirow">
          <button class="mini play" onclick="playSelected('TIKI TIKI.mp3')">Play</button>
          <button class="mini pause" onclick="pauseToggle()">Pause</button>
        </div>
      </div>
    
    </section>
  </main>

<script>
const audioMap = new Map();
let currentAudio = null;
let currentFile = null;

function getAudio(file) {
  if (!audioMap.has(file)) {
    const a = new Audio(encodeURI(file));
    a.preload = "auto";
    a.volume = document.getElementById("vol").value;
    a.addEventListener("ended", () => {
      if (currentFile === file) {
        document.getElementById("status").textContent = "Finished: " + file;
        clearActive();
      }
    });
    audioMap.set(file, a);
  }
  return audioMap.get(file);
}

function clearActive() {
  document.querySelectorAll(".card").forEach(card => card.classList.remove("active"));
}

function setActiveByName(file) {
  clearActive();
  const cards = [...document.querySelectorAll(".card")];
  const name = file ? file : "";
  cards.forEach(card => {
    const label = card.querySelector(".trackname")?.textContent || "";
    if (label === file.replace(/\.[^.]+$/, "") || label === file) {
      card.classList.add("active");
    }
  });
}

function selectSound(file) {
  currentFile = file;
  document.getElementById("status").textContent = "Selected: " + file;
  setActiveByName(file);
}

function playSelected(file) {
  if (!file) {
    const first = "Yara Yara Ya Phonk (Slowed).mp3" || null;
    if (!first) return;
    file = first;
  }
  currentFile = file;
  const audio = getAudio(file);
  if (currentAudio && currentAudio !== audio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  currentAudio = audio;
  audio.currentTime = 0;
  audio.volume = document.getElementById("vol").value;
  audio.play().then(() => {
    document.getElementById("status").textContent = "Playing: " + file;
    setActiveByName(file);
  }).catch(err => {
    console.error(err);
    document.getElementById("status").textContent = "Could not play: " + file;
    alert("Could not play this sound. Make sure the MP3 is in the same folder as index.html.");
  });
}

function pauseToggle() {
  if (!currentAudio) {
    document.getElementById("status").textContent = "Nothing is playing";
    return;
  }
  if (currentAudio.paused) {
    currentAudio.play().then(() => {
      document.getElementById("status").textContent = "Resumed: " + currentFile;
    }).catch(err => {
      console.error(err);
      document.getElementById("status").textContent = "Could not resume";
    });
  } else {
    currentAudio.pause();
    document.getElementById("status").textContent = "Paused: " + currentFile;
  }
}

function stopAll() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  audioMap.forEach(a => {
    a.pause();
    a.currentTime = 0;
  });
  currentAudio = null;
  currentFile = null;
  clearActive();
  document.getElementById("status").textContent = "Stopped";
}

function setVolume(v) {
  audioMap.forEach(a => a.volume = v);
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    pauseToggle();
  } else if (e.key.toLowerCase() === "s") {
    stopAll();
  }
});
</script>
</body>
</html>
